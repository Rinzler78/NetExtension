name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:


  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Extract version from tag
      id: extract_version
      run: |
        TAG=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$TAG" >> $GITHUB_OUTPUT
        echo "Extracted version: $TAG"

    - name: Update project version
      run: |
        # GNU sed (ubuntu-latest compatible) — use sed -i '' for macOS local runs
        sed -i "s|<PackageVersion>.*</PackageVersion>|<PackageVersion>${{ steps.extract_version.outputs.VERSION }}</PackageVersion>|" src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj

    - name: Restore dependencies
      run: dotnet restore src/Rinzler78.NetExtension.sln

    - name: Build Release
      run: dotnet build src/Rinzler78.NetExtension.sln --configuration Release --no-restore

    - name: Test Release
      run: dotnet test src/Rinzler78.NetExtension.Tests/Rinzler78.NetExtension.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Pack Release NuGet package
      run: dotnet pack src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj --configuration Release --no-build --output ./release-artifacts

    - name: Generate release notes
      id: release_notes
      run: |
        VERSION="${{ steps.extract_version.outputs.VERSION }}"

        # Extract the matching [VERSION] section from CHANGELOG.md
        if [ -f CHANGELOG.md ]; then
          ./scripts/changelog-extract.sh --file CHANGELOG.md --version "$VERSION" --output release_notes.md
        else
          # Fallback: generate from git log
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## [$VERSION]"
            echo ""
            if [ -n "$LAST_TAG" ]; then
              echo "### Changes since $LAST_TAG"
              git log --oneline "$LAST_TAG..HEAD" \
                --format="- %s" \
                | grep -E "^- (feat|fix|docs|refactor|perf|test|chore)" || true
            else
              echo "- Initial release"
            fi
          } > release_notes.md
        fi

        # Append installation instructions
        {
          echo ""
          echo "### 📦 Installation"
          echo '```bash'
          echo "dotnet add package Rinzler78.NetExtension --version $VERSION"
          echo '```'
        } >> release_notes.md

        echo "RELEASE_NOTES_FILE=release_notes.md" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.VERSION }}
        name: Release v${{ steps.extract_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          ./release-artifacts/*.nupkg
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to NuGet (if configured)
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -n "$NUGET_API_KEY" ]; then
          dotnet nuget push ./release-artifacts/*.nupkg \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        else
          echo "NUGET_API_KEY not configured, skipping NuGet publish"
        fi

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push ./release-artifacts/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --skip-duplicate
