name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/Rinzler78.NetExtension.sln

    - name: Build
      run: dotnet build src/Rinzler78.NetExtension.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test src/Rinzler78.NetExtension.Tests/Rinzler78.NetExtension.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Generate coverage report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:"Html;Cobertura"

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        directory: ./coverage
        fail_ci_if_error: false

    - name: Pack NuGet package
      run: dotnet pack src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj --configuration Release --no-build --output ./artifacts

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: ./artifacts/*.nupkg
        retention-days: 90

  release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract version from tag
      id: extract_version
      run: |
        TAG=${GITHUB_REF#refs/tags/v}
        echo "VERSION=$TAG" >> $GITHUB_OUTPUT
        echo "Extracted version: $TAG"

    - name: Update project version
      run: |
        sed -i 's/<PackageVersion>.*<\/PackageVersion>/<PackageVersion>${{ steps.extract_version.outputs.VERSION }}<\/PackageVersion>/' src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj
        sed -i 's/<Version>.*<\/Version>/<Version>${{ steps.extract_version.outputs.VERSION }}<\/Version>/' src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj

    - name: Restore dependencies
      run: dotnet restore src/Rinzler78.NetExtension.sln

    - name: Build Release
      run: dotnet build src/Rinzler78.NetExtension.sln --configuration Release --no-restore

    - name: Test Release
      run: dotnet test src/Rinzler78.NetExtension.Tests/Rinzler78.NetExtension.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Pack Release NuGet package
      run: dotnet pack src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj --configuration Release --no-build --output ./release-artifacts

    - name: Generate release notes
      id: release_notes
      run: |
        echo "## 🚀 Release Notes for v${{ steps.extract_version.outputs.VERSION }}" > release_notes.md
        echo "" >> release_notes.md
        echo "### ✨ What's New" >> release_notes.md
        echo "- Release v${{ steps.extract_version.outputs.VERSION }} of Rinzler78.NetExtension" >> release_notes.md
        echo "" >> release_notes.md
        echo "### 📦 Installation" >> release_notes.md
        echo '```bash' >> release_notes.md
        echo "dotnet add package Rinzler78.NetExtension --version ${{ steps.extract_version.outputs.VERSION }}" >> release_notes.md
        echo '```' >> release_notes.md
        echo "" >> release_notes.md
        echo "### 🔧 Changes" >> release_notes.md

        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$LAST_TAG" ]; then
          echo "Changes since $LAST_TAG:" >> release_notes.md
          git log --oneline "$LAST_TAG..HEAD" --grep="^feat\|^fix\|^docs\|^refactor" --format="- %s" >> release_notes.md
        else
          echo "- Initial release" >> release_notes.md
        fi

        echo "" >> release_notes.md
        echo "### 📊 Stats" >> release_notes.md
        echo "- **Package Size**: $(du -h ./release-artifacts/*.nupkg | cut -f1 | head -1)" >> release_notes.md
        echo "- **Build Time**: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release_notes.md
        echo "- **Target Framework**: .NET 8.0" >> release_notes.md

        echo "RELEASE_NOTES_FILE=release_notes.md" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.extract_version.outputs.VERSION }}
        name: Release v${{ steps.extract_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          ./release-artifacts/*.nupkg
          ./release-artifacts/*.snupkg
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish to NuGet (if configured)
      if: secrets.NUGET_API_KEY != ''
      run: |
        dotnet nuget push ./release-artifacts/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push ./release-artifacts/*.nupkg \
          --api-key ${{ secrets.GITHUB_TOKEN }} \
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
          --skip-duplicate

  cleanup:
    needs: [build-and-test, release]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - name: Cleanup artifacts
      uses: actions/github-script@v7
      with:
        script: |
          const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });

          for (const artifact of artifacts.data.artifacts) {
            if (artifact.name === 'nuget-package') {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
          }
