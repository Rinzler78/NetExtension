repos:
  # C# formatting and linting
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format
        language: system
        args: [src/Rinzler78.NetExtension.sln, --verify-no-changes, --verbosity, diagnostic]
        files: \.cs$
        pass_filenames: false

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # EditorConfig validation
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 2.7.3
    hooks:
      - id: editorconfig-checker
        exclude: \.md$

  # Comments language check
  - repo: local
    hooks:
      - id: check-comments-language
        name: Check comments are in English
        entry: python3 scripts/check-comments-language.py
        language: system
        files: \.cs$
        pass_filenames: true

  # Security checks (disabled due to version compatibility issues)
  # - repo: https://github.com/Yelp/detect-secrets
  #   rev: v1.4.0
  #   hooks:
  #     - id: detect-secrets
  #       args: [--baseline, .secrets.baseline]

  # C# specific linting and testing
  - repo: local
    hooks:
      - id: dotnet-build
        name: dotnet build
        entry: dotnet build
        language: system
        files: \.cs$
        args: [src/Rinzler78.NetExtension.sln, --configuration, Release, --no-restore, --verbosity, normal, '/p:TreatWarningsAsErrors=true']
        pass_filenames: false

      - id: dotnet-test
        name: dotnet test
        entry: dotnet test
        language: system
        files: \.cs$
        args: [src/Rinzler78.NetExtension.Tests/Rinzler78.NetExtension.Tests.csproj, --configuration, Release, --no-build, --verbosity, minimal]
        pass_filenames: false

      - id: dotnet-security-scan
        name: dotnet security scan
        entry: dotnet list
        language: system
        files: \.cs$
        args: [src/Rinzler78.NetExtension.sln, package, --vulnerable, --include-transitive]
        pass_filenames: false

      - id: dotnet-package-validation
        name: dotnet package validation
        entry: sh
        language: system
        files: \.cs$
        args: [-c, 'dotnet pack src/Rinzler78.NetExtension.Standard/Rinzler78.NetExtension.Standard.csproj --configuration Release --no-build --output ./artifacts && (dotnet tool install -g dotnet-validate 2>/dev/null || true) && (dotnet validate package local ./artifacts/*.nupkg 2>/dev/null || echo "Package validation skipped - tool not available")']
        pass_filenames: false
